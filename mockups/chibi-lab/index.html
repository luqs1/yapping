<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chibi lab</title>
<style>
  /* A neutral bench for comparing chibi styles. Nothing here should have
     more personality than the marks themselves. */
  :root {
    --bg: #ffffff; --ink: #1b1b1f; --muted: #6e6e76; --line: #e7e7ea; --wash: #f6f6f7;
    --dark: #1e1f22; --dark-ink: #ececee; --dark-muted: #9a9aa2; --dark-line: #2e3034; --dark-wash: #2a2b2f;
    --cb-cut: #ffffff; --cb-bubble: #ffffff;
  }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 28px 24px 64px }
  header.top { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--line) }
  header.top h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -.01em }
  header.top nav { display: flex; gap: 6px; flex-wrap: wrap }
  header.top a { color: var(--muted); text-decoration: none; font-size: 13px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px }
  header.top a.on { color: var(--ink); border-color: var(--ink) }

  section.style { padding: 26px 0 30px; border-bottom: 1px solid var(--line) }
  section.style h2 { font-size: 16px; margin: 0; font-weight: 650 }
  section.style h2 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 8px; font-family: ui-monospace, Menlo, monospace }
  section.style .why { color: var(--muted); margin: 3px 0 16px; max-width: 90ch }

  .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
  .board { border-radius: 10px; padding: 14px 16px 16px; border: 1px solid var(--line); background: var(--bg); min-width: 0 }
  .board.dark { background: var(--dark); border-color: var(--dark); color: var(--dark-ink); --cb-cut: #1e1f22; --cb-bubble: #1e1f22; color-scheme: dark }
  .board.dark .lbl, .board.dark .sz { color: var(--dark-muted) }

  table.grid { border-collapse: collapse; width: 100% }
  table.grid th { font: 500 11px/1 ui-monospace, Menlo, monospace; color: var(--muted); text-align: center; padding: 0 0 10px }
  .board.dark table.grid th { color: var(--dark-muted) }
  table.grid th.h { text-align: left; width: 74px }
  table.grid td { text-align: center; padding: 7px 0 }
  table.grid td.h { text-align: left; font: 500 11px/1 ui-monospace, Menlo, monospace; color: var(--muted) }
  .board.dark table.grid td.h { color: var(--dark-muted) }
  table.grid td span.c { display: inline-flex; width: 32px; height: 32px }
  .small { display: grid; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line) }
  .board.dark .small { border-color: var(--dark-line) }
  .small .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
  .small .sz { font: 500 11px/1 ui-monospace, Menlo, monospace; color: var(--muted); width: 34px }
  .small .set { display: inline-flex; gap: 7px; align-items: center; padding-right: 12px; border-right: 1px solid var(--line) }
  .board.dark .small .set { border-color: var(--dark-line) }
  .small .set:last-child { border-right: 0 }
  .small svg, table.grid svg { display: block }

  /* in-context strip: a sidebar-ish chat column */
  .ctx { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 14px }
  .chat { display: grid; gap: 4px; align-content: start }
  .chat .meta { font-size: 11px; color: var(--muted) }
  .board.dark .chat .meta { color: var(--dark-muted) }
  .bub { justify-self: start; max-width: 260px; background: var(--wash); border-radius: 14px 14px 14px 4px; padding: 7px 11px; font-size: 13.5px }
  .board.dark .bub { background: var(--dark-wash) }
  .bub.me { justify-self: end; background: #2f6fed; color: #fff; border-radius: 14px 14px 4px 14px }
  .assist { display: flex; align-items: center; gap: 6px; min-height: 26px; padding-left: 2px }
  .assist.mine { justify-content: flex-end; padding-right: 2px }
  .assist .pair { display: inline-flex; gap: 2px }
  .assist .line { font-size: 12px; color: var(--muted) }
  .board.dark .assist .line { color: var(--dark-muted) }
  .prop { display: grid; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; max-width: 100%; min-width: 0 }
  .chat { min-width: 0 }
  .bub { overflow-wrap: anywhere }
  .board.dark .prop { border-color: var(--dark-line) }
  .prop .t { display: flex; gap: 7px; align-items: center; font-size: 12.5px; font-weight: 550 }
  .prop .t svg { flex: none }
  .prop .btns { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 31px }
  .prop button { white-space: nowrap; font: 500 12px/1 inherit; font-family: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit }
  .prop button.p { background: var(--ink); color: var(--bg); border-color: var(--ink) }
  .board.dark .prop button { border-color: var(--dark-line) }
  .board.dark .prop button.p { background: var(--dark-ink); color: var(--dark); border-color: var(--dark-ink) }

  body.still * { animation-play-state: paused !important }
  body.focus .wrap { max-width: 1180px }
  @media (max-width: 900px) { .boards, .ctx { grid-template-columns: 1fr } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>Chibi lab</h1><nav id="nav"></nav></header>
  <main id="main"></main>
</div>
<script type="module">
const STYLES = ['flat', 'signal', 'sticker', 'clay', 'pixel']
const HARNESS = ['claude', 'opencode', 'pi', 'codex']
const STATES = ['idle', 'reading', 'talking', 'ready', 'done', 'sleeping']
const q = new URLSearchParams(location.search)
const only = q.get('style')
const part = q.get('part') || 'all'
if (q.get('still')) document.body.classList.add('still')
if (only) document.body.classList.add('focus')

const mods = {}
for (const s of [...STYLES, 'current']) {
  try { mods[s] = await import(s === 'current' ? '../../shared/chibi.js' : `../../shared/chibi-styles/${s}.js`) } catch (e) { console.warn(s, e) }
}
const list = [...STYLES.filter((s) => mods[s]), 'current']
document.getElementById('nav').innerHTML = [`<a href="./" class="${only ? '' : 'on'}">all</a>`, ...list.map((s) => `<a href="?style=${s}" class="${only === s ? 'on' : ''}">${s}</a>`)].join('')

function board(m, dark) {
  const c = (h, st, size, turn = 0) => m.chibi(h, { state: st, size, turn })
  const grid = `<table class="grid"><tr><th class="h"></th>${STATES.map((s) => `<th>${s}</th>`).join('')}</tr>${HARNESS.map((h) => `<tr><td class="h">${h}</td>${STATES.map((s) => `<td><span class="c">${c(h, s, 32)}</span></td>`).join('')}</tr>`).join('')}</table>`
  const small = `<div class="small">${[24, 18].map((z) => `<div class="row"><span class="sz">${z}px</span>${HARNESS.map((h) => `<span class="set">${STATES.map((s) => c(h, s, z)).join('')}</span>`).join('')}</div>`).join('')}</div>`
  return `<div class="board ${dark ? 'dark' : ''}">${grid}${small}</div>`
}

function context(m, dark, mine = 'claude', theirs = 'opencode') {
  const c = (h, st, size, turn = 0) => m.chibi(h, { state: st, size, turn })
  return `<div class="board ${dark ? 'dark' : ''}"><div class="ctx" style="margin-top:0">
    <div class="chat"><span class="meta">Finn · 14:02</span><div class="bub">hey can you take a look at my demo?</div>
      <div class="assist">${c(mine, 'reading', 22)}<span class="line">Reading</span></div></div>
    <div class="chat"><span class="meta">Finn · 14:05</span><div class="bub">yes! send it over</div>
      <div class="assist"><span class="pair">${c(mine, 'talking', 22)}${c(theirs, 'talking', 22, 1)}</span><span class="line">Talking to Finn's ${theirs}</span></div></div>
    <div class="chat"><span class="meta">Theo · Slack · 13:40</span><div class="bub">got the API docs handy?</div>
      <div class="prop"><div class="t">${c(mine, 'ready', 24)}<span>Send Theo “Acme API docs v3.pdf”?</span></div><div class="btns"><button class="p">Send</button><button>Not now</button></div></div>
      <div class="assist" style="margin-top:6px">${c(mine, 'done', 18)}<span class="line">Sent · Thu 14:30 invite</span></div></div>
  </div></div>`
}

const main = document.getElementById('main')
const show = only ? list.filter((s) => s === only) : list.filter((s) => s !== 'current')
main.innerHTML = show.map((s) => {
  const m = mods[s]
  const info = m.INFO || { name: 'Current (shared/chibi.js)', line: 'The set the user rejected, for reference.' }
  return `<section class="style" id="${s}"><h2>${info.name}<small>${s}.js</small></h2><p class="why">${info.line}</p>
    ${part !== 'ctx' ? `<div class="boards">${board(m, false)}${board(m, true)}</div>` : ''}
    ${part !== 'grid' ? `<div class="boards" style="margin-top:14px">${context(m, false, 'claude', 'opencode')}${context(m, true, 'codex', 'pi')}</div>` : ''}
  </section>`
}).join('')
</script>
</body>
</html>
